<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules.ai - Swarm Intelligence Trader</title>
    <link rel="stylesheet" href="/static/styles.css">
</head><body>
    <div class="container">
        <div class="left-panel">
            <div class="panel">
                <h3>Control Panel</h3>
                <!-- Future controls for backtesting etc. -->
            </div>
            <div class="panel chat-panel">
                <h3>Agent Debate Layer</h3>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="message bot">Welcome! Ask me about the current market outlook.</div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Ask the agents...">
                        <button id="chat-send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div id="chart-container"></div>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/charts.js"></script>
</body>
</html>
