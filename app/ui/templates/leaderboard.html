<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Leaderboard specific styles */
        .leaderboard-container { padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; border: 1px solid var(--border-color); text-align: left; }
        th { background-color: #2a2e39; }
        tbody tr:nth-child(even) { background-color: var(--panel-background); }
    </style>
</head>
<body>
    <div class="leaderboard-container">
        <h1>Paper Trading Leaderboard</h1>
        <nav>
            <a href="/">Home</a> | <a href="/workshop.html">Workshop</a> | <a href="/marketplace.html">Marketplace</a>
        </nav>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Username</th>
                    <th>Preset Name</th>
                    <th>Sharpe Ratio</th>
                    <th>Max Drawdown (%)</th>
                    <th>PnL (%)</th>
                    <th>Resilience Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard data will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <script src="/static/leaderboard.js"></script>
</body>
</html>
