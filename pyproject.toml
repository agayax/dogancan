[tool.poetry]
name = "binance-bot-projesi"
version = "0.1.0"
description = "Binance Trading Bot Project"
authors = ["Jules"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
python-binance = "^1.0.19"
python-dotenv = "^1.0.1"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
duckdb = "^0.10.0"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
jinja2 = "^3.1.3"
websockets = "^12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "playwright (>=1.55.0,<2.0.0)"
]
