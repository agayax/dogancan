[tool.poetry]
name = "binance-bot-projesi"
version = "0.1.0"
description = "Binance Trading Bot Project"
authors = ["Jules"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
python-binance = "^1.0.19"
python-dotenv = "^1.0.1"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
duckdb = "^0.10.0"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
jinja2 = "^3.1.3"
websockets = "^12.0"
python-telegram-bot = "^21.4"
ccxt = "^4.3.45"
optuna = "^3.6.1"
click = "^8.1.7"
openai = "^1.35.3"
scikit-learn = "^1.5.0"
feedparser = "^6.0.11"
xgboost = "^2.1.0"
scipy = "^1.14.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "playwright (>=1.55.0,<2.0.0)"
]
